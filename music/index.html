<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fa233b">
  <meta name="description" content="A free music player: search the whole Apple catalog with 30-second previews, stream free full-length songs, and play your own files.">
  <title>Encore Music</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fa233b'/%3E%3Cpath fill='%23fff' d='M23 7.6v11.9a3.4 3.4 0 1 1-2.2-3.2V11.6l-8.6 1.7v8.2a3.4 3.4 0 1 1-2.2-3.2V9.7a1 1 0 0 1 .8-1l11-2.1a1 1 0 0 1 1.2 1z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.9v14.2a1 1 0 0 0 1.5.86l11.6-7.1a1 1 0 0 0 0-1.72L8.5 4.04A1 1 0 0 0 7 4.9z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="4.5" width="4" height="15" rx="1.2"/><rect fill="currentColor" x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M2.5 6.3v11.4a.9.9 0 0 0 1.4.75l7.6-5.25v4.5a.9.9 0 0 0 1.4.75l8.2-5.7a.9.9 0 0 0 0-1.5l-8.2-5.7a.9.9 0 0 0-1.4.75v4.5L3.9 5.55a.9.9 0 0 0-1.4.75z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" transform="matrix(-1 0 0 1 24 0)" d="M2.5 6.3v11.4a.9.9 0 0 0 1.4.75l7.6-5.25v4.5a.9.9 0 0 0 1.4.75l8.2-5.7a.9.9 0 0 0 0-1.5l-8.2-5.7a.9.9 0 0 0-1.4.75v4.5L3.9 5.55a.9.9 0 0 0-1.4.75z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle fill="currentColor" cx="5.5" cy="12" r="1.8"/><circle fill="currentColor" cx="12" cy="12" r="1.8"/><circle fill="currentColor" cx="18.5" cy="12" r="1.8"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path fill="currentColor" d="M19 3.9v11.4a3.1 3.1 0 1 1-2-2.9V8.2l-8 1.6v7.6a3.1 3.1 0 1 1-2-2.9V6.3a1 1 0 0 1 .8-1l10-2a1 1 0 0 1 1.2 1z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M12 20s-7.5-4.6-9.2-9.3C1.7 7.5 3.8 4.5 7.1 4.5c2 0 3.5 1 4.9 2.9 1.4-1.9 2.9-2.9 4.9-2.9 3.3 0 5.4 3 4.3 6.2C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M12 20s-7.5-4.6-9.2-9.3C1.7 7.5 3.8 4.5 7.1 4.5c2 0 3.5 1 4.9 2.9 1.4-1.9 2.9-2.9 4.9-2.9 3.3 0 5.4 3 4.3 6.2C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3 7h3.2c1.9 0 3 .9 4 2.6l2.6 4.8c1 1.7 2.1 2.6 4 2.6H20M3 17h3.2c1.3 0 2.2-.4 3-1.2M13.8 8.2c.8-.8 1.7-1.2 3-1.2H20M17.5 4l3 3-3 3M17.5 14l3 3-3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M17 2.5l3 3-3 3M4 11.5v-2a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 12.5v2a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M17 2.5l3 3-3 3M4 11.5v-2a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 12.5v2a4 4 0 0 1-4 4H4M11 10.2l1.4-1v5.6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></g></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></g></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M5 4v16M10 4v16M14.5 4.6L19 19.4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M4 6h16M4 12h10M4 18h7"/><path fill="currentColor" d="M15 14.6v6.3l5-3.15z"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M20 11.5a8 8 0 0 1-11.7 7.1L4 19.8l1.1-4A8 8 0 1 1 20 11.5z"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M8.5 10h7M8.5 13.5h4.5"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path fill="currentColor" d="M3.5 9.4h3.3L11.5 5.6v12.8l-4.7-3.8H3.5z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15 9a4.2 4.2 0 0 1 0 6M17.8 6.3a8 8 0 0 1 0 11.4"/></symbol>
    <symbol id="i-volume-low" viewBox="0 0 24 24"><path fill="currentColor" d="M5.5 9.4h3.3l4.7-3.8v12.8l-4.7-3.8H5.5z"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V7"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.5 5.3 3.5 8.5s-1.1 6.1-3.5 8.5c-2.4-2.4-3.5-5.3-3.5-8.5s1.1-6.1 3.5-8.5z"/></g></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></g></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></g></symbol>
    <symbol id="i-next-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 6h9M4 12h9M4 18h6M17.5 20V9M14 12.5L17.5 9l3.5 3.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></g></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" href="#/browse">
        <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-note"/></svg></span>
        <span>Encore</span>
      </a>
      <form class="side-search" id="side-search-form" role="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="side-search" type="search" placeholder="Search" autocomplete="off" aria-label="Search music">
      </form>
      <nav class="side-nav" aria-label="Discover">
        <a href="#/browse" data-nav="browse"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span>Browse</span></a>
        <a href="#/free" data-nav="free"><svg class="ic" aria-hidden="true"><use href="#i-bars"/></svg><span>Free Full Songs</span></a>
        <a href="#/search" data-nav="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Search</span></a>
      </nav>
      <div class="side-label">Library</div>
      <nav class="side-nav" aria-label="Library">
        <a href="#/recent" data-nav="recent"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><span>Recently Played</span></a>
        <a href="#/liked" data-nav="liked"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg><span>Liked Songs</span></a>
        <a href="#/files" data-nav="files"><svg class="ic" aria-hidden="true"><use href="#i-upload"/></svg><span>My Files</span></a>
      </nav>
      <div class="side-label">
        <span>Playlists</span>
        <button class="icon-btn small" data-action="new-playlist" aria-label="New playlist"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
      <nav class="side-nav" id="playlist-nav" aria-label="Playlists"></nav>
      <p class="side-foot">Catalog songs play as 30-second previews from Apple. Full songs come from Audius and from your own files.</p>
    </aside>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <footer class="player is-empty" id="player" aria-label="Player">
    <div class="p-left">
      <button class="p-art-btn" data-action="open-np" aria-label="Open Now Playing"><span id="p-art-wrap"></span></button>
      <div class="p-meta" data-action="open-np">
        <div class="p-title" id="p-title">Not Playing</div>
        <div class="p-artist" id="p-artist">Pick any song to start</div>
      </div>
      <button class="icon-btn like p-like js-like" data-like="" aria-label="Like" hidden><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></button>
    </div>
    <div class="p-center">
      <div class="p-controls">
        <button class="icon-btn p-desk js-shuffle" data-action="shuffle" aria-label="Shuffle" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn p-desk" data-action="prev" aria-label="Previous"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg></button>
        <button class="icon-btn play-btn js-play" data-action="toggle-play" aria-label="Play"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-action="next" aria-label="Next"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
        <button class="icon-btn p-desk js-repeat" data-action="repeat" aria-label="Repeat: off"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="p-seek">
        <span class="js-cur">0:00</span>
        <input class="range js-seek" id="p-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
        <span class="js-dur">0:00</span>
      </div>
    </div>
    <div class="p-right">
      <span class="chip js-chip" hidden></span>
      <button class="icon-btn" data-action="np-lyrics" aria-label="Lyrics"><svg class="ic" aria-hidden="true"><use href="#i-quote"/></svg></button>
      <button class="icon-btn" data-action="np-queue" aria-label="Playing Next"><svg class="ic" aria-hidden="true"><use href="#i-queue"/></svg></button>
      <div class="vol">
        <svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg>
        <input class="range js-vol" id="p-vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>
    </div>
    <div class="p-line" aria-hidden="true"></div>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <a href="#/browse" data-nav="browse"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span>Browse</span></a>
    <a href="#/free" data-nav="free"><svg class="ic" aria-hidden="true"><use href="#i-bars"/></svg><span>Free Songs</span></a>
    <a href="#/search" data-nav="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Search</span></a>
    <a href="#/library" data-nav="library"><svg class="ic" aria-hidden="true"><use href="#i-library"/></svg><span>Library</span></a>
  </nav>

  <section class="np" id="np" role="dialog" aria-modal="true" aria-label="Now Playing" hidden>
    <div class="np-bg"><img id="np-bg" alt=""></div>
    <div class="np-inner">
      <header class="np-top">
        <button class="icon-btn" data-action="close-np" aria-label="Close Now Playing"><svg class="ic" aria-hidden="true"><use href="#i-chev-down"/></svg></button>
        <span class="np-from" id="np-from">Now Playing</span>
        <button class="icon-btn" id="np-more" data-more="" aria-label="More options"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
      </header>
      <div class="np-body">
        <div class="np-main">
          <div id="np-art-wrap" class="np-art-wrap"></div>
          <div class="np-info">
            <div class="np-text">
              <div class="np-title" id="np-title"></div>
              <div class="np-artist" id="np-artist"></div>
            </div>
            <button class="icon-btn like js-like" data-like="" aria-label="Like"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></button>
          </div>
          <div class="np-seek">
            <input class="range js-seek" id="np-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
            <div class="np-times"><span class="js-cur">0:00</span><span class="chip js-chip" hidden></span><span class="js-dur">0:00</span></div>
          </div>
          <div class="np-controls">
            <button class="icon-btn" data-action="prev" aria-label="Previous"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg></button>
            <button class="icon-btn js-play" data-action="toggle-play" aria-label="Play"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button>
            <button class="icon-btn" data-action="next" aria-label="Next"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
          </div>
          <div class="np-vol">
            <svg class="ic" aria-hidden="true"><use href="#i-volume-low"/></svg>
            <input class="range js-vol" id="np-vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
            <svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg>
          </div>
          <div class="np-actions">
            <button class="icon-btn" data-action="np-lyrics" aria-label="Lyrics"><svg class="ic" aria-hidden="true"><use href="#i-quote"/></svg></button>
            <button class="icon-btn js-shuffle" data-action="shuffle" aria-label="Shuffle" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg></button>
            <button class="icon-btn js-repeat" data-action="repeat" aria-label="Repeat: off"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg></button>
            <button class="icon-btn" data-action="np-queue" aria-label="Playing Next"><svg class="ic" aria-hidden="true"><use href="#i-queue"/></svg></button>
          </div>
        </div>
        <div class="np-panel" id="np-panel" hidden></div>
      </div>
    </div>
  </section>

  <div class="menu" id="menu" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <audio id="audio" preload="metadata"></audio>
  <input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.webm" multiple hidden>

  <script src="app.js"></script>
</body>
</html>
